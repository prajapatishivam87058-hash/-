name: APK बनाओ

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ज़िप खोलो
        run: |
          COUNT=$(ls *.zip 2>/dev/null | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "रिपॉज़िटरी में ठीक एक ज़िप होनी चाहिए, अभी $COUNT हैं"
            ls *.zip || true
            exit 1
          fi
          ZIP=$(ls *.zip)
          echo "ज़िप मिली: $ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          if [ ! -f project/settings.gradle ]; then
            SUB=$(dirname "$(find project -maxdepth 3 -name settings.gradle | head -n 1)")
            echo "प्रोजेक्ट यहाँ मिला: $SUB"
            echo "PROJECT_DIR=$SUB" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK बनाओ
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: APK का नाम रखो
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" Meri-Padhai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Meri-Padhai
          path: Meri-Padhai.apk
